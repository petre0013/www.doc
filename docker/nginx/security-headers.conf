# Included at server level AND in every location that has its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).
#
# nosniff: a browser must not MIME-sniff a user-uploaded asset into something
# executable; pairs with the server-side image allow-list.
add_header X-Content-Type-Options "nosniff" always;
# Clickjacking: only this site may frame its pages (it never frames itself
# today; SAMEORIGIN keeps that option open). frame-ancestors is the modern form,
# X-Frame-Options covers older browsers.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# Don't leak internal page URLs (titles, ids) to external sites via Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

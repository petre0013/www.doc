name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REPO: petre0013/www.doc
  # A published release gets its own tag; a manual run (workflow_dispatch) is
  # a preview of main and goes to the "edge" tag instead.
  VERSION_TAG: ${{ github.event.release.tag_name || 'edge' }}
  IS_STABLE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.VERSION_TAG }}

      - name: Build and push App Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: app
          push: true
          # VERSION_TAG is the release tag (or "edge" for a manual run); the
          # `latest` tag is added ONLY for a published, non-prerelease release
          # (empty lines are skipped), so deploys tracking `latest` — e.g.
          # Komodo auto-update — never pick up an untagged "dev" build.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:${{ env.VERSION_TAG }}
            ${{ env.DOCKERHUB_REPO }}-app:${{ env.VERSION_TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-app:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
            ${{ env.IS_STABLE == 'true' && format('{0}-app:latest', env.DOCKERHUB_REPO) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the release tag in so instances can report their version
          # (Settings footer, backup manifests). "dev" when built by hand.
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name || 'dev' }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan App image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKERHUB_REPO }}-app:${{ env.VERSION_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Build and push Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: web
          push: true
          # VERSION_TAG is the release tag (or "edge" for a manual run); the
          # `latest` tag is added ONLY for a published, non-prerelease release
          # (empty lines are skipped), so deploys tracking `latest` — e.g.
          # Komodo auto-update — never pick up an untagged "dev" build.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ env.VERSION_TAG }}
            ${{ env.DOCKERHUB_REPO }}-web:${{ env.VERSION_TAG }}
            ${{ env.IS_STABLE == 'true' && format('{0}/{1}-web:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
            ${{ env.IS_STABLE == 'true' && format('{0}-web:latest', env.DOCKERHUB_REPO) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Web image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKERHUB_REPO }}-web:${{ env.VERSION_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Update Docker Hub Description for App
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}-app
          readme-filepath: ./README.md

      - name: Update Docker Hub Description for Web
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}-web
          readme-filepath: ./README.md
